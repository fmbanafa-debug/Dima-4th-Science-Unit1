<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 4 Science - Unit 1 Interactive Worksheet</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        .mic-active {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(225, 29, 72, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
        }
    </style>
</head>
<body class="text-slate-900 flex flex-col min-h-screen justify-between pb-6">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md">
                    <i class="fa-solid fa-flask text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-none">Grade 4 Science Revision</h1>
                    <p class="text-xs text-slate-500 font-medium mt-1">Unit 1: Classification of Organisms</p>
                </div>
            </div>

            <!-- Header Controls Toolbar -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Dropdown Jump to Question -->
                <div class="relative">
                    <select id="jumpSelect" onchange="jumpToQuestion(this.value)" class="bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 font-bold text-xs rounded-xl px-3 py-2.5 pr-8 transition cursor-pointer appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Populated dynamically -->
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-xs text-slate-500 pointer-events-none"></i>
                </div>

                <!-- Speech Mic Toggle -->
                <button id="micBtn" onclick="toggleSpeech()" title="Speak Answer (Safari Enabled)" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-300 px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-microphone text-sm" id="micIcon"></i>
                    <span id="micLabel" class="hidden sm:inline">Voice</span>
                </button>

                <!-- Check Current Button -->
                <button onclick="checkCurrentAnswer()" title="Check Answer" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm transition">
                    <i class="fa-solid fa-check text-sm"></i>
                    <span class="hidden md:inline">Check</span>
                </button>

                <!-- English Hint Button -->
                <button onclick="showHint()" title="Get Hint" class="bg-amber-500 hover:bg-amber-400 text-white px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm transition">
                    <i class="fa-solid fa-lightbulb text-sm"></i>
                    <span class="hidden md:inline">Hint</span>
                </button>

                <!-- Arabic Explanation Button -->
                <button onclick="showArabicExplanation()" title="توضيح بالعربية للأم" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-2 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm transition">
                    <i class="fa-solid fa-language text-sm"></i>
                    <span>عربي</span>
                </button>

                <!-- Reveal All Button -->
                <button onclick="revealAnswer()" title="Reveal Answer" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-3 py-2 rounded-xl font-bold text-xs transition">
                    <i class="fa-solid fa-eye text-sm"></i>
                    <span class="hidden lg:inline">Reveal</span>
                </button>

                <!-- Erase All / Reset -->
                <button onclick="eraseCurrentAnswer()" title="Erase Answer" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-xl font-bold text-xs border border-slate-300 transition">
                    <i class="fa-solid fa-eraser text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-200 h-2">
            <div id="progressBar" class="bg-indigo-600 h-2 transition-all duration-300" style="width: 0%"></div>
        </div>
    </header>

    <!-- Speech Alert Banner -->
    <div id="speechBanner" class="hidden max-w-2xl mx-auto mt-3 px-4 py-2 bg-rose-600 text-white rounded-xl text-xs font-semibold flex items-center justify-between shadow-md">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-circle-dot animate-ping"></i>
            <span id="speechStatusText">Listening... Speak clearly into your microphone!</span>
        </div>
        <button onclick="stopSpeech()" class="text-white hover:underline font-bold">Stop</button>
    </div>

    <!-- Main Container for Question Display -->
    <main class="max-w-3xl mx-auto px-4 py-6 w-full flex-grow flex flex-col justify-center">

        <!-- Question Card Container -->
        <div id="questionCard" class="bg-white rounded-3xl p-6 sm:p-8 shadow-xl border border-slate-200">
            
            <!-- Question Category Badge & Counter -->
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
                <span id="categoryBadge" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider border border-indigo-200">
                    Multiple Choice
                </span>
                <span id="questionCounter" class="text-xs font-bold text-slate-500">
                    Question 1 of 56
                </span>
            </div>

            <!-- Question Title / Prompt -->
            <h2 id="questionPrompt" class="text-lg sm:text-xl font-bold text-slate-900 mb-6 leading-relaxed">
                Loading question...
            </h2>

            <!-- Interactive Area -->
            <div id="interactiveArea" class="space-y-4 mb-6">
                <!-- Dynamic Content Here -->
            </div>

            <!-- Feedback Box -->
            <div id="feedbackBox" class="hidden p-4 rounded-2xl mb-4 text-sm font-semibold flex items-start gap-3">
                <i id="feedbackIcon" class="fa-solid text-base mt-0.5"></i>
                <div id="feedbackText"></div>
            </div>

            <!-- Hint Box -->
            <div id="hintBox" class="hidden p-4 rounded-2xl bg-amber-50 border border-amber-200 text-amber-900 text-xs sm:text-sm font-medium mb-4 flex items-start gap-2.5">
                <i class="fa-solid fa-lightbulb text-amber-500 mt-0.5 text-base"></i>
                <div>
                    <span class="font-bold block mb-0.5">Hint:</span>
                    <span id="hintText"></span>
                </div>
            </div>

            <!-- Arabic Explanation Box -->
            <div id="arabicBox" class="hidden p-4 rounded-2xl bg-teal-50 border border-teal-200 text-teal-950 text-xs sm:text-sm font-medium mb-4 flex items-start gap-2.5" dir="rtl">
                <i class="fa-solid fa-book-open-reader text-teal-600 mt-0.5 text-base"></i>
                <div>
                    <span class="font-bold block mb-0.5 text-teal-800">توضيح للأم / المصطلحات العلمية:</span>
                    <span id="arabicText" class="leading-relaxed"></span>
                </div>
            </div>

        </div>

    </main>

    <!-- Bottom Navigation Controls -->
    <footer class="max-w-3xl mx-auto px-4 w-full">
        <div class="flex items-center justify-between gap-4">
            <button id="prevBtn" onclick="navigate(-1)" class="bg-white hover:bg-slate-100 text-slate-700 font-bold px-5 py-3 rounded-2xl shadow-sm border border-slate-200 transition flex items-center gap-2 text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-arrow-left"></i> Previous
            </button>

            <div class="text-center text-xs font-semibold text-slate-500">
                Unit 1 Revision • Grade 4
            </div>

            <button id="nextBtn" onclick="navigate(1)" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-2xl shadow-md transition flex items-center gap-2 text-sm disabled:opacity-40 disabled:cursor-not-allowed">
                Next <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </footer>

    <!-- Custom Modal Dialog -->
    <div id="customModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
            <div id="modalIconContainer" class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-indigo-200">
                <i id="modalIcon" class="fa-solid fa-info"></i>
            </div>
            <h3 id="modalTitle" class="font-bold text-lg text-slate-900 mb-1">Notice</h3>
            <p id="modalMessage" class="text-slate-600 text-xs sm:text-sm mb-5 leading-relaxed">Message text goes here.</p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-sm transition">Got it!</button>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // Worksheet Data Set - All 56 items with added Arabic explanations for teaching/facilitation
        const questionsData = [
            // Page 1 & 2: Multiple Choice Questions (1 - 17)
            { id: 1, type: 'mcq', category: 'Multiple Choice', prompt: '1. What is the name of the process by which plants make their own food?', options: ['Photosynthesis', 'Fertilization', 'Reproduction'], answer: 0, hint: 'It starts with "Photo-" and uses sunlight, water, and carbon dioxide.', arabic: 'البناء الضوئي (Photosynthesis): العملية التي يصنع بها النبات غذاءه باستخدام ضوء الشمس والماء وثاني أكسيد الكربون.' },
            { id: 2, type: 'mcq', category: 'Multiple Choice', prompt: '2. What is the process whereby organisms produce young of the same kind?', options: ['Photosynthesis', 'Fertilization', 'Reproduction'], answer: 2, hint: 'It ensures species can continue their line.', arabic: 'التكاثر (Reproduction): قدرة الكائنات الحية على إنتاج أفراد جديدة من نفس النوع لضمان بقائها.' },
            { id: 3, type: 'mcq', category: 'Multiple Choice', prompt: '3. Which part within a plant cell makes food for the plant?', options: ['Nucleus', 'Cell membrane', 'Chloroplast'], answer: 2, hint: 'It contains the green pigment chlorophyll.', arabic: 'البلاستيدات الخضراء (Chloroplast): الجزء المسئول عن مصنع الغذاء داخل خلية النبات ويحتوي على الكلوروفيل الأخضر.' },
            { id: 4, type: 'mcq', category: 'Multiple Choice', prompt: '4. What is a unicellular organism?', options: ['An organism with one brain', 'An organism made up of many cells', 'An organism made up of one cell'], answer: 2, hint: 'The prefix "uni-" means single or one.', arabic: 'كائن وحيد الخلية (Unicellular): كائن حي يتكون جسمه بالكامل من خلية واحدة فقط مثل البكتيريا والأميبا.' },
            { id: 5, type: 'mcq', category: 'Multiple Choice', prompt: '5. What is the name given to a group of cells of the same kind that have the same function?', options: ['Tissue', 'Organism', 'Cell group'], answer: 0, hint: 'Examples include muscle tissue or epidermal tissue.', arabic: 'النسيج (Tissue): مجموعة من الخلايا المتشابهة التي تعمل معاً لأداء وظيفة محددة.' },
            { id: 6, type: 'mcq', category: 'Multiple Choice', prompt: '6. Which is NOT a multicellular organism?', options: ['Bacteria', 'Snail', 'Fern'], answer: 0, hint: 'This is a single-celled microscopic organism.', arabic: 'متعدد الخلايا (Multicellular): كائن يتكون من خلايا كثيرة. البكتيريا استثناء لأنها كائن وحيد الخلية.' },
            { id: 7, type: 'mcq', category: 'Multiple Choice', prompt: '7. What is the name given to two or more types of tissue that are grouped together with a common function?', options: ['Organ', 'Organism', 'Cells'], answer: 0, hint: 'Examples include the heart, stomach, or plant leaves.', arabic: 'العضو (Organ): مجموعة أنسجة مختلفة تتجمع معاً لعمل وظيفة معينة مثل القلب أو المعدة أو الورقة النباتية.' },
            { id: 8, type: 'mcq', category: 'Multiple Choice', prompt: '8. Which group of organisms are considered the simplest organisms on Earth?', options: ['Protists', 'Bacteria', 'Plants'], answer: 1, hint: 'They lack a membrane-bound nucleus and are microscopic.', arabic: 'البكتيريا (Bacteria): أبسط وأصغر الكائنات الحية على كوكب الأرض، وتتكون من خلية واحدة بسيطة.' },
            { id: 9, type: 'mcq', category: 'Multiple Choice', prompt: '9. Which organism is NOT a protist?', options: ['Kelp', 'Amoeba', 'Mushroom'], answer: 2, hint: 'This organism belongs to the Fungi kingdom.', arabic: 'الطلائعيات (Protists): مملكة كائنات معظمها وحيد الخلية مثل الأميبا والعشب البحري. الفطر (Mushroom) ينتمي لمملكة الفطريات وليس الطلائعيات.' },
            { id: 10, type: 'mcq', category: 'Multiple Choice', prompt: '10. Which organism is NOT a type of fungus?', options: ['Amoeba', 'Puff ball', 'Yeast'], answer: 0, hint: 'It is a single-celled protist that moves using pseudopods.', arabic: 'الفطريات (Fungi): مثل الخميرة وفطر المشروم. الأميبا ليست فطريات بل تنتمي لمملكة الطلائعيات.' },
            { id: 11, type: 'mcq', category: 'Multiple Choice', prompt: '11. What is the name given to the group of plants that have internal structure (Xylem and Phloem)?', options: ['Seed plant', 'Vascular plant', 'Flowering plant'], answer: 1, hint: 'Vascular tissues carry water and nutrients.', arabic: 'نباتات وعائية (Vascular plants): نباتات تحتوي على أنابيب داخلية (الخشب واللحاء) لنقل الماء والغذاء مثل الأشجار والزهور.' },
            { id: 12, type: 'mcq', category: 'Multiple Choice', prompt: '12. What is the name given to the group of animals with a backbone?', options: ['Vertebrates', 'Invertebrates', 'Mammals'], answer: 0, hint: 'Humans, dogs, and birds belong to this group.', arabic: 'فقاريات (Vertebrates): حيوانات تمتلك عموداً فقرياً وعظاماً مثل الإنسان والطيور والأسماك.' },
            { id: 13, type: 'mcq', category: 'Multiple Choice', prompt: '13. Which animal is an invertebrate?', options: ['Parrot', 'Frog', 'Worm'], answer: 2, hint: 'This animal has no bones or spine.', arabic: 'لافقاريات (Invertebrates): حيوانات لا تمتلك عموداً فقرياً مثل الدودة والحشرات والإسبنج.' },
            { id: 14, type: 'mcq', category: 'Multiple Choice', prompt: '14. Plants growing or bending in the direction of sunlight is an example of...', options: ['Growth', 'Reproducing', 'Responding to change'], answer: 2, hint: 'Organisms react to environmental stimuli.', arabic: 'الاستجابة للتغيرات (Responding to change): رد فعل الكائن الحي تجاه ما حوله، مثل ميلان النبات نحو الضوء.' },
            { id: 15, type: 'mcq', category: 'Multiple Choice', prompt: '15. Organisms that break down dead animals or plants and help recycle nutrients are called...', options: ['Decomposers', 'Producers', 'Consumers'], answer: 0, hint: 'Fungi and certain bacteria perform this essential job.', arabic: 'المحللات (Decomposers): كائنات تعيد تدوير البيئة بتحليل جثث الحيوانات والنباتات الميتة مثل الفطريات والبكتيريا.' },
            { id: 16, type: 'mcq', category: 'Multiple Choice', prompt: '16. An organism that is made up of one cell is called a... organism.', options: ['Multicellular', 'Unicellular', 'Tissue'], answer: 1, hint: '"Uni" means single.', arabic: 'كائن وحيد الخلية (Unicellular): كلمة Uni تعني واحد.' },
            { id: 17, type: 'mcq', category: 'Multiple Choice', prompt: '17. Plants without vascular internal structures are called...', options: ['Fungi', 'Vascular plant', 'Non-vascular plant'], answer: 2, hint: 'Mosses are a key example of this type.', arabic: 'نباتات لاوعائية (Non-vascular plants): نباتات صغيرة ليس لديها أنابيب وعائية لنقل الماء مثل الحزازيات (Mosses).' },

            // Page 3: Short Answer Questions
            { id: 18, type: 'open', category: 'Questions & Answers', prompt: 'Q1. Why do cells come in a range of different shapes and sizes?', answerKey: 'Cells have different shapes and sizes because they perform different functions or specialized roles.', keywords: ['function', 'job', 'role', 'specialized', 'shape', 'purpose'], hint: 'Think about how a red blood cell works compared to a nerve cell!', arabic: 'تنوع الخلايا: تختلف الخلايا في شكلها وحجمها حسب وظيفتها الخاصة (مثل خلية الدم الكروية لنقل الأكسجين أو الخلية العصبية الطويلة لنقل الإشارات).' },
            { id: 19, type: 'open', category: 'Questions & Answers', prompt: 'Q2. List the characteristics of all living organisms.', answerKey: 'Growth, reproduction, responding to change, using energy/nutrition, made of cells, and excretion/respiration.', keywords: ['grow', 'reproduce', 'respond', 'cells', 'energy', 'food', 'move'], hint: 'Think about growth, reproduction, responding to surroundings, and needing energy.', arabic: 'خصائص الكائنات الحية: النمو، التكاثر، الاستجابة، تتكون من خلايا، استخدام الطاقة/الغذاء، والتنفس.' },

            // Page 3: Matching Items
            { id: 20, type: 'match', category: 'Matching', prompt: 'Match: 1. Lactobacillus', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 2, hint: 'This bacteria gives yogurt its sour taste and texture.', arabic: 'بكتيريا اللبن (Lactobacillus): بكتيريا نافعة تستخدم في صناعة الزبادي.' },
            { id: 21, type: 'match', category: 'Matching', prompt: 'Match: 2. Rhizobium', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 4, hint: 'It lives in plant roots and fixes nitrogen.', arabic: 'بكتيريا الرايزوبيوم (Rhizobium): بكتيريا في التربة تعيش على جذور النباتات وتساعدها في الامتصاص.' },
            { id: 22, type: 'match', category: 'Matching', prompt: 'Match: 3. Yeast', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 0, hint: 'This fungus makes bread dough rise.', arabic: 'الخميرة (Yeast): فطر نافع وحيد الخلية يستخدم في صناعة الخبز والمعجنات.' },
            { id: 23, type: 'match', category: 'Matching', prompt: 'Match: 4. Paramecium', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 1, hint: 'A single-celled protist covered in cilia.', arabic: 'البراميسيوم (Paramecium): كائن دقيق من الطلائعيات شكله يشبه الحذاء.' },
            { id: 24, type: 'match', category: 'Matching', prompt: 'Match: 5. Digestive system', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 3, hint: 'It breaks down food so the body can absorb nutrients.', arabic: 'الجهاز الهضمي (Digestive System): مجموعة أعضاء (المريء، المعدة، الأمعاء) تعمل معاً لهضم الطعام.' },
            { id: 25, type: 'match', category: 'Matching', prompt: 'Match: 6. Penicillium', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 6, hint: 'Discovered by Alexander Fleming to create life-saving medicine.', arabic: 'عفن البنسليوم (Penicillium): فطر يُصنع منه مضاد حيوي هام للشفاء من الأمراض (البنسلين).' },
            { id: 26, type: 'match', category: 'Matching', prompt: 'Match: 7. Carbon dioxide', options: ['Used to make bread and other food and drink products.', 'Is an organism that is shaped like a shoe.', 'A bacteria used to make yogurt.', 'Your esophagus, stomach, and intestines work together as this.', 'Bacterium found in soil that helps a plant to get nutrients.', 'Plants need sunlight and this gas to carry out photosynthesis.', 'Is a type of mold that is used to make penicillin.'], answer: 5, hint: 'Gas absorbed by plant leaves during photosynthesis.', arabic: 'ثاني أكسيد الكربون (Carbon dioxide): الغاز الذي يمتصه النبات لصنع الغذاء بالبناء الضوئي.' },

            // Page 4: Fill in the Blanks (1 to 15)
            { id: 27, type: 'fill', category: 'Fill in the Blanks', prompt: '1. A living thing is called an ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'organism', hint: 'General term for any plant, animal, or single cell.', arabic: 'الكائن الحي (Organism): اسم يطلق على أي شجر، حيوان، أو كائن مجهري حي.' },
            { id: 28, type: 'fill', category: 'Fill in the Blanks', prompt: '2. Plants produce their own food through the process of ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'Photosynthesis', hint: 'Requires light energy, water, and gas.', arabic: 'البناء الضوئي (Photosynthesis): عملية صنع الغذاء بالنبات.' },
            { id: 29, type: 'fill', category: 'Fill in the Blanks', prompt: '3. ________ is the process whereby an organism produces new young of the same kind.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'reproduction', hint: 'Essential life process for continuing a species.', arabic: 'التكاثر (Reproduction): إنتاج صغار جديدة بنفس الخصائص.' },
            { id: 30, type: 'fill', category: 'Fill in the Blanks', prompt: '4. When an animal senses danger, it may ________ by running away.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'respond', hint: 'Reaction to a stimulus.', arabic: 'يستجيب (Respond): رد فعل الخوف أو الفرار عند الخطر.' },
            { id: 31, type: 'fill', category: 'Fill in the Blanks', prompt: '5. All organisms are made up of one or more ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'cells', hint: 'The basic building blocks of life.', arabic: 'الخلايا (Cells): وحدة البناء الأساسية لكل الكائنات الحية.' },
            { id: 32, type: 'fill', category: 'Fill in the Blanks', prompt: '6. Inside a plant cell, photosynthesis takes place in the ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'chloroplast', hint: 'Green organelle in plant cells.', arabic: 'البلاستيدة الخضراء (Chloroplast): العُضية التي تستقبل الضوء بالخلية النباتية.' },
            { id: 33, type: 'fill', category: 'Fill in the Blanks', prompt: '7. ________ organisms are organisms made up of more than one cell.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'multicellular', hint: 'Humans, trees, and dogs are examples.', arabic: 'متعدد الخلايا (Multicellular): يتكون من ملايين الخلايا كالقطط والأشجار.' },
            { id: 34, type: 'fill', category: 'Fill in the Blanks', prompt: '8. Cells of the same kind that have the same function are often grouped together as ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'tissue', hint: 'Level of biological organization between cell and organ.', arabic: 'النسيج (Tissue): تجمع خلايا متشابهة معاً.' },
            { id: 35, type: 'fill', category: 'Fill in the Blanks', prompt: '9. Two or more types of tissue that are grouped together make up an ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'organ', hint: 'Examples: Heart, lung, leaf.', arabic: 'العضو (Organ): تجمع أنسجة مختلفة لتكوين عضواً مثل الرئة أو القلب.' },
            { id: 36, type: 'fill', category: 'Fill in the Blanks', prompt: '10. An ________ is a group of organs that perform a central task.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'Organ system', hint: 'Examples: Digestive or Respiratory system.', arabic: 'الجهاز الحيوي (Organ system): أعضاء تعمل معاً لمهمة كبيرة كالجهاز التنفسي.' },
            { id: 37, type: 'fill', category: 'Fill in the Blanks', prompt: '11. Scientists classify organisms into six main groups called ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'kingdoms', hint: 'Major classification level.', arabic: 'الممالك (Kingdoms): المجموعات الرئيسية الست لتصنيف الحياة.' },
            { id: 38, type: 'fill', category: 'Fill in the Blanks', prompt: '12. Kelp, amoeba and paramecium are classified together as ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'protists', hint: 'Kingdom of mostly single-celled eukaryotic organisms.', arabic: 'الطلائعيات (Protists): تنتمي إليها الأميبا وعشب البحر.' },
            { id: 39, type: 'fill', category: 'Fill in the Blanks', prompt: '13. Mushrooms, yeast and mold are classified together as ________.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'fungi', hint: 'They absorb nutrients from decaying organic matter.', arabic: 'الفطريات (Fungi): تشمل عيش الغراب والخميرة والأعفان.' },
            { id: 40, type: 'fill', category: 'Fill in the Blanks', prompt: '14. ________ help to recycle dead organisms into nutrients in the soil.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'decomposers', hint: 'Nature\'s recyclers.', arabic: 'المحللات (Decomposers): تعيد المغذيات للتربة عن طريق تحليل البقايا الميتة.' },
            { id: 41, type: 'fill', category: 'Fill in the Blanks', prompt: '15. ________ are plants with internal structures, called xylem and phloem, used to transport food and water.', wordBank: ['organism', 'Photosynthesis', 'reproduction', 'respond', 'cells', 'chloroplast', 'multicellular', 'tissue', 'organ', 'Organ system', 'kingdoms', 'protists', 'fungi', 'decomposers', 'Vascular plant'], answer: 'Vascular plant', hint: 'Trees and flowers belong here.', arabic: 'النباتات الوعائية (Vascular plant): تمتلك أنابيب لنقل المياه والغذاء.' },

            // Page 5: True or False (1 to 9)
            { id: 42, type: 'tf', category: 'True / False', prompt: '1. All organisms are made up of at least one cell.', answer: true, hint: 'The cell is the basic structural unit of all living things.', arabic: 'صح: الخلية هي الوحدة البنائية الأساسية لكل كائن حي.' },
            { id: 43, type: 'tf', category: 'True / False', prompt: '2. All cells contain chloroplasts.', answer: false, hint: 'Animal cells do NOT have chloroplasts!', arabic: 'خطأ: البلاستيدات توجد في خلايا النباتات فقط لصنع الغذاء، ولا توجد بالخلايا الحيوانية.' },
            { id: 44, type: 'tf', category: 'True / False', prompt: '3. Different cells have different functions.', answer: true, hint: 'Nerve cells conduct impulses, muscle cells contract.', arabic: 'صح: تتنوع وظائف الخلايا بحسب موقعها ودورها.' },
            { id: 45, type: 'tf', category: 'True / False', prompt: '4. All plants are of the same size, shape and color.', answer: false, hint: 'Think of tiny mosses vs giant redwood trees.', arabic: 'خطأ: تتفاوت النباتات بين أعشاب صغيرة جداً وأشجار عملاقة.' },
            { id: 46, type: 'tf', category: 'True / False', prompt: '5. Like bacteria, some fungi can be harmful and can cause infection.', answer: true, hint: 'Athlete\'s foot is an example of a fungal infection.', arabic: 'صح: بعض الفطريات ممرضة مثل فطر قدم الرياضي.' },
            { id: 47, type: 'tf', category: 'True / False', prompt: '6. Organisms made of more than one cell are called unicellular organisms.', answer: false, hint: '"Uni" means one, "Multi" means many.', arabic: 'خطأ: الكائنات متعددة الخلايا تسمى Multicellular وليست Unicellular.' },
            { id: 48, type: 'tf', category: 'True / False', prompt: '7. Organs are the smallest unit within an organism that carries out life processes.', answer: false, hint: 'Cells are the smallest basic units, not organs.', arabic: 'خطأ: أصغر وحدة هي الخلية وليس العضو.' },
            { id: 49, type: 'tf', category: 'True / False', prompt: '8. Organisms can be classified into six main groups called Kingdoms.', answer: true, hint: 'The 6 kingdoms are Bacteria, Ancient Bacteria, Protists, Fungi, Plants, Animals.', arabic: 'صح: تنقسم الكائنات الحية إلى 6 ممالك رئيسية.' },
            { id: 50, type: 'tf', category: 'True / False', prompt: '9. When organisms grow, they usually get taller and heavier.', answer: true, hint: 'Growth involves an increase in size and mass.', arabic: 'صح: النمو يصحبه زيادة بالارتفاع والوزن والكتلة.' },

            // Page 6: Name these organisms and their kingdoms
            { id: 51, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Amoeba', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Protists', hint: 'Single-celled eukaryotic organism with pseudopods.', arabic: 'الأميبا (Amoeba): كائن دقيق وحيد الخلية يتبع مملكة الطلائعيات (Protists).' },
            { id: 52, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Giant kelp', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Protists', hint: 'Although large like seaweed, kelp is classified as a protist.', arabic: 'عشب البحر العملاق (Giant Kelp): يعيش بالماء ورغم ضخامته يصنف كطلائعيات (Protists).' },
            { id: 53, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Salmonella', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Bacteria', hint: 'Microscopic single-celled bacterium causing food poisoning.', arabic: 'السالمونيلا (Salmonella): بكتيريا تسبب التسمم الغذائي وتتبع مملكة البكتيريا (Bacteria).' },
            { id: 54, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Penicillium', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Fungi', hint: 'It is a mold used to create antibiotics.', arabic: 'عفن البنسليوم (Penicillium): يتبع مملكة الفطريات (Fungi).' },
            { id: 55, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Puff ball', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Fungi', hint: 'Releases spores in a cloud when mature.', arabic: 'فطر كرة الغبار (Puff ball): نوع من الفطريات يُطلق الأبواغ، ويتبع مملكة الفطريات (Fungi).' },
            { id: 56, type: 'organism_match', category: 'Kingdom Identification', prompt: 'Identify Kingdom for Organism: Zombie Fungus (Ophiocordyceps)', options: ['Bacteria', 'Protists', 'Fungi', 'Plants', 'Animals', 'Ancient bacteria'], answer: 'Fungi', hint: 'As the name states, it is a specialized fungus.', arabic: 'فطر الزومبي (Zombie Fungus): فطر يتطفل على الحشرات، ينتمي لمملكة الفطريات (Fungi).' }
        ];

        // Global State Variables
        let currentIndex = 0;
        let userAnswers = {};
        let recognition = null;
        let isListening = false;

        // Initialize Application
        window.onload = function() {
            populateDropdown();
            setupSpeechRecognition();
            renderQuestion();
        };

        // Populate Select Dropdown
        function populateDropdown() {
            const select = document.getElementById('jumpSelect');
            select.innerHTML = '';
            questionsData.forEach((q, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `Q${q.id}: ${q.category} - ${q.prompt.substring(0, 24)}...`;
                select.appendChild(opt);
            });
        }

        // Render Current Question View
        function renderQuestion() {
            const q = questionsData[currentIndex];
            
            // Update Headers & Progress
            document.getElementById('questionCounter').textContent = `Question ${currentIndex + 1} of ${questionsData.length}`;
            document.getElementById('categoryBadge').textContent = q.category;
            document.getElementById('questionPrompt').textContent = q.prompt;
            document.getElementById('jumpSelect').value = currentIndex;

            const progressPct = ((currentIndex + 1) / questionsData.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;

            // Reset Boxes
            hideFeedback();
            document.getElementById('hintBox').classList.add('hidden');
            document.getElementById('arabicBox').classList.add('hidden');

            // Render Dynamic Input Control
            const container = document.getElementById('interactiveArea');
            container.innerHTML = '';

            if (q.type === 'mcq' || q.type === 'match') {
                q.options.forEach((optText, optIdx) => {
                    const btn = document.createElement('button');
                    const isSelected = userAnswers[q.id] === optIdx;
                    btn.className = `w-full p-4 rounded-2xl border-2 transition text-left flex items-center gap-3 ${
                        isSelected 
                            ? 'border-indigo-600 bg-indigo-50 text-indigo-950 shadow-sm' 
                            : 'border-slate-200 hover:border-slate-300 bg-white text-slate-800'
                    }`;
                    btn.onclick = () => {
                        userAnswers[q.id] = optIdx;
                        renderQuestion();
                    };
                    btn.innerHTML = `
                        <span class="w-7 h-7 rounded-full ${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'} font-bold text-xs flex items-center justify-center border border-slate-200 shrink-0">
                            ${String.fromCharCode(65 + optIdx)}
                        </span>
                        <span class="font-semibold text-sm sm:text-base">${optText}</span>
                    `;
                    container.appendChild(btn);
                });
            } else if (q.type === 'tf') {
                [true, false].forEach((val) => {
                    const btn = document.createElement('button');
                    const isSelected = userAnswers[q.id] === val;
                    btn.className = `w-full p-4 rounded-2xl border-2 transition text-left font-bold flex items-center gap-3 ${
                        isSelected 
                            ? 'border-indigo-600 bg-indigo-50 text-indigo-950 shadow-sm' 
                            : 'border-slate-200 hover:border-slate-300 bg-white text-slate-800'
                    }`;
                    btn.onclick = () => {
                        userAnswers[q.id] = val;
                        renderQuestion();
                    };
                    btn.innerHTML = `
                        <i class="fa-regular ${val ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-rose-600'} text-xl"></i>
                        <span>${val ? 'TRUE' : 'FALSE'}</span>
                    `;
                    container.appendChild(btn);
                });
            } else if (q.type === 'fill') {
                const selectedVal = userAnswers[q.id] || '';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'fillInput';
                input.placeholder = 'Type or speak your answer...';
                input.value = selectedVal;
                input.className = 'w-full p-4 text-base font-bold text-slate-900 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-indigo-600 focus:bg-white focus:outline-none transition mb-4 shadow-inner';
                input.oninput = (e) => userAnswers[q.id] = e.target.value;
                container.appendChild(input);

                const wordBankTitle = document.createElement('p');
                wordBankTitle.className = 'text-xs font-bold text-slate-500 uppercase tracking-wider mb-2';
                wordBankTitle.textContent = 'Word Bank (Click to Select):';
                container.appendChild(wordBankTitle);

                const chipGrid = document.createElement('div');
                chipGrid.className = 'flex flex-wrap gap-2';
                q.wordBank.forEach(word => {
                    const chip = document.createElement('button');
                    chip.className = 'bg-slate-100 hover:bg-indigo-100 hover:text-indigo-800 border border-slate-300 text-slate-700 text-xs font-bold px-3 py-2 rounded-xl transition';
                    chip.textContent = word;
                    chip.onclick = () => {
                        document.getElementById('fillInput').value = word;
                        userAnswers[q.id] = word;
                    };
                    chipGrid.appendChild(chip);
                });
                container.appendChild(chipGrid);

            } else if (q.type === 'open') {
                const textarea = document.createElement('textarea');
                textarea.id = 'openInput';
                textarea.rows = 4;
                textarea.placeholder = 'Type your answer or click the microphone icon to dictate your answer...';
                textarea.value = userAnswers[q.id] || '';
                textarea.className = 'w-full p-4 text-sm font-semibold text-slate-900 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-indigo-600 focus:bg-white focus:outline-none transition shadow-inner';
                textarea.oninput = (e) => userAnswers[q.id] = e.target.value;
                container.appendChild(textarea);

            } else if (q.type === 'organism_match') {
                const selectedVal = userAnswers[q.id] || '';
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';

                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    const isSelected = selectedVal === opt;
                    btn.className = `p-3.5 rounded-2xl border-2 font-bold text-sm transition text-left flex items-center justify-between ${
                        isSelected 
                            ? 'border-indigo-600 bg-indigo-50 text-indigo-950 shadow-sm' 
                            : 'border-slate-200 bg-white hover:border-slate-300 text-slate-800'
                    }`;
                    btn.onclick = () => {
                        userAnswers[q.id] = opt;
                        renderQuestion();
                    };
                    btn.innerHTML = `
                        <span>${opt}</span>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-indigo-600"></i>' : ''}
                    `;
                    grid.appendChild(btn);
                });
                container.appendChild(grid);
            }

            // Update Navigation Buttons State
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === questionsData.length - 1;
        }

        // Show Arabic Explanation
        function showArabicExplanation() {
            const q = questionsData[currentIndex];
            const arabicBox = document.getElementById('arabicBox');
            document.getElementById('arabicText').textContent = q.arabic || 'لا يوجد شرح عربي إضافي لهذا السؤال.';
            arabicBox.classList.remove('hidden');
        }

        // Check Answer for Current Active Question
        function checkCurrentAnswer() {
            const q = questionsData[currentIndex];
            const userAns = userAnswers[q.id];

            if (userAns === undefined || userAns === '') {
                showFeedback(false, 'Please select or enter an answer first before checking!');
                return;
            }

            if (q.type === 'mcq' || q.type === 'match') {
                if (userAns === q.answer) {
                    showFeedback(true, 'Correct! Excellent job!');
                } else {
                    showFeedback(false, `Incorrect. The correct choice is option (${String.fromCharCode(65 + q.answer)}): "${q.options[q.answer]}".`);
                }
            } else if (q.type === 'tf') {
                if (userAns === q.answer) {
                    showFeedback(true, 'Correct! Great scientific reasoning!');
                } else {
                    showFeedback(false, `Incorrect. The correct answer is ${q.answer ? 'TRUE' : 'FALSE'}.`);
                }
            } else if (q.type === 'fill') {
                const cleanUser = String(userAns).trim().toLowerCase();
                const cleanAns = String(q.answer).trim().toLowerCase();
                if (cleanUser === cleanAns) {
                    showFeedback(true, 'Correct! Perfect fill-in match.');
                } else {
                    showFeedback(false, `Not quite right. The expected answer is: "${q.answer}".`);
                }
            } else if (q.type === 'open') {
                const cleanUser = String(userAns).toLowerCase();
                const matches = q.keywords.filter(k => cleanUser.includes(k.toLowerCase()));
                if (matches.length >= 1) {
                    showFeedback(true, `Great response! Key concept addressed. Sample Answer: "${q.answerKey}"`);
                } else {
                    showFeedback(false, `Sample Answer: "${q.answerKey}" (Try including keywords like: ${q.keywords.join(', ')})`);
                }
            } else if (q.type === 'organism_match') {
                if (userAns === q.answer) {
                    showFeedback(true, `Correct! Belongs to Kingdom: ${q.answer}`);
                } else {
                    showFeedback(false, `Incorrect. Correct Kingdom is: ${q.answer}`);
                }
            }
        }

        // Reveal Answer
        function revealAnswer() {
            const q = questionsData[currentIndex];
            if (q.type === 'mcq' || q.type === 'match') {
                userAnswers[q.id] = q.answer;
            } else if (q.type === 'tf') {
                userAnswers[q.id] = q.answer;
            } else if (q.type === 'fill') {
                userAnswers[q.id] = q.answer;
            } else if (q.type === 'open') {
                userAnswers[q.id] = q.answerKey;
            } else if (q.type === 'organism_match') {
                userAnswers[q.id] = q.answer;
            }
            renderQuestion();
            checkCurrentAnswer();
        }

        // Show Hint
        function showHint() {
            const q = questionsData[currentIndex];
            const hintBox = document.getElementById('hintBox');
            document.getElementById('hintText').textContent = q.hint;
            hintBox.classList.remove('hidden');
        }

        // Erase Answer
        function eraseCurrentAnswer() {
            const q = questionsData[currentIndex];
            delete userAnswers[q.id];
            renderQuestion();
        }

        // Navigation Controls
        function navigate(direction) {
            stopSpeech();
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < questionsData.length) {
                currentIndex = newIndex;
                renderQuestion();
            }
        }

        function jumpToQuestion(idx) {
            stopSpeech();
            currentIndex = parseInt(idx);
            renderQuestion();
        }

        // Speech Recognition Setup (Safari WebKit & Chrome compatible)
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'en-US';

                recognition.onstart = function() {
                    isListening = true;
                    document.getElementById('micBtn').classList.add('mic-active', 'bg-rose-600', 'text-white');
                    document.getElementById('speechBanner').classList.remove('hidden');
                    document.getElementById('speechStatusText').textContent = 'Listening... Speak clearly now!';
                };

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    processSpeechInput(transcript);
                };

                recognition.onerror = function(event) {
                    console.error('Speech Recognition Error:', event.error);
                    stopSpeech();
                    showModal('Speech Error', 'Microphone access failed or was blocked. Please verify microphone permissions in browser settings.');
                };

                recognition.onend = function() {
                    if (isListening) {
                        try { recognition.start(); } catch(e) {}
                    } else {
                        stopSpeechUI();
                    }
                };
            }
        }

        function toggleSpeech() {
            if (!recognition) {
                showModal('Browser Support', 'Speech recognition is not supported on this browser version. Use Safari on iOS/macOS or Chrome.');
                return;
            }
            if (isListening) {
                stopSpeech();
            } else {
                isListening = true;
                try {
                    recognition.start();
                } catch(e) {
                    console.error(e);
                }
            }
        }

        function stopSpeech() {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            stopSpeechUI();
        }

        function stopSpeechUI() {
            document.getElementById('micBtn').classList.remove('mic-active', 'bg-rose-600', 'text-white');
            document.getElementById('speechBanner').classList.add('hidden');
        }

        function processSpeechInput(text) {
            if (!text) return;
            const q = questionsData[currentIndex];
            const cleanText = text.trim();

            if (q.type === 'fill' || q.type === 'open') {
                userAnswers[q.id] = cleanText;
                const inputElem = document.getElementById(q.type === 'fill' ? 'fillInput' : 'openInput');
                if (inputElem) inputElem.value = cleanText;
            } else if (q.type === 'mcq' || q.type === 'match') {
                const lower = cleanText.toLowerCase();
                q.options.forEach((opt, idx) => {
                    if (lower.includes(opt.toLowerCase()) || lower.includes(`option ${String.fromCharCode(97 + idx)}`)) {
                        userAnswers[q.id] = idx;
                        renderQuestion();
                    }
                });
            } else if (q.type === 'tf') {
                const lower = cleanText.toLowerCase();
                if (lower.includes('true')) {
                    userAnswers[q.id] = true;
                    renderQuestion();
                } else if (lower.includes('false')) {
                    userAnswers[q.id] = false;
                    renderQuestion();
                }
            }
        }

        // Feedback Helpers
        function showFeedback(isSuccess, message) {
            const fbBox = document.getElementById('feedbackBox');
            const fbIcon = document.getElementById('feedbackIcon');
            const fbText = document.getElementById('feedbackText');

            fbBox.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-900', 'bg-rose-50', 'text-rose-900', 'border-emerald-200', 'border-rose-200');
            fbIcon.classList.remove('fa-circle-check', 'fa-circle-xmark', 'text-emerald-600', 'text-rose-600');

            if (isSuccess) {
                fbBox.classList.add('bg-emerald-50', 'text-emerald-900', 'border', 'border-emerald-200');
                fbIcon.classList.add('fa-circle-check', 'text-emerald-600');
            } else {
                fbBox.classList.add('bg-rose-50', 'text-rose-900', 'border', 'border-rose-200');
                fbIcon.classList.add('fa-circle-xmark', 'text-rose-600');
            }

            fbText.textContent = message;
        }

        function hideFeedback() {
            document.getElementById('feedbackBox').classList.add('hidden');
        }

        // Modal Helpers
        function showModal(title, msg) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }
    </script>
</body>
</html>
