<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 4 Science - Unit 1 Interactive Worksheet</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #000000;
            color: #f8fafc;
            min-height: 100vh;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .mic-active {
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        /* Custom dark scrollbar */
        select::-webkit-scrollbar {
            width: 8px;
        }
        select::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col min-h-screen justify-between pb-6">

    <!-- Top Navigation Header -->

        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl shadow-md shadow-indigo-950">

                </div>

                    <h1 class="text-lg font-bold text-white leading-none">Grade 4 Science Revision</h1>
                    <p class="text-xs text-slate-400 font-medium mt-1">Unit 1: Classification of Organisms</p>
                </div>
            </div>

            <!-- Header Controls Toolbar -->
            <div class="flex items-center gap-2 flex-wrap">
                <!-- Dropdown Jump to Question -->
                <div class="relative">
                    <select id="jumpSelect" onchange="jumpToQuestion(this.value)" class="bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-semibold text-xs rounded-xl px-3 py-2.5 pr-8 transition cursor-pointer appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- Populated dynamically -->
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-xs text-slate-500 pointer-events-none"></i>
                </div>

                <!-- Speech Mic Toggle -->
                <button id="micBtn" onclick="toggleSpeech()" title="Speak Answer (Safari Enabled)" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 px-3.5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1.5 transition border border-rose-800 shadow-sm">
                    <i class="fa-solid fa-microphone text-sm" id="micIcon"></i>
                    <span id="micLabel" class="hidden sm:inline">Voice Answer</span>
                </button>

                <!-- Check Current Button -->
                <button onclick="checkCurrentAnswer()" title="Check Answer" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1.5 shadow-sm transition">
                    <i class="fa-solid fa-check text-sm"></i>
                    <span class="hidden md:inline">Check</span>
                </button>

                <!-- Hint Button -->
                <button onclick="showHint()" title="Get Hint" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2.5 rounded-xl font-bold text-xs flex items-center gap-1 shadow-sm transition">
                    <i class="fa-solid fa-lightbulb text-sm"></i>
                    <span class="hidden md:inline">Hint</span>
                </button>

                <!-- Reveal All Button -->

                    <i class="fa-solid fa-eye text-sm"></i>
                    <span class="hidden lg:inline">Reveal</span>
                </button>

                <!-- Erase All / Reset -->
                <button onclick="eraseCurrentAnswer()" title="Erase Answer" class="bg-slate-900 hover:bg-slate-800 text-slate-300 px-3 py-2.5 rounded-xl font-bold text-xs border border-slate-700 transition">
                    <i class="fa-solid fa-eraser text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-900 h-1.5">

    </header>

                        transcript += event.results[i][0].transcript;
                    }
                    processSpeechInput(transcript);
                };

                recognition.onerror = function(event) {
                    console.error('Speech Recognition Error:', event.error);
                    stopSpeech();
                    showModal('Speech Error', 'Microphone access failed or speech was not recognized. Please try typing directly or allow microphone permissions.');

                    if (isListening) {

                        stopSpeechUI();
                    }
                };
            } else {
                console.warn('Speech Recognition API not supported in this browser.');
            }
